<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Panneaux LED — DuoDisplay</title>
<link rel="icon" href="logo.png" type="image/png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f4f5f1;
    color: #293a34;
    padding: 12px;
    max-width: 1300px;
    margin: 0 auto;
    font-size: 13px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
    padding: 12px 18px;
    background: #293a34;
    border-radius: 6px;
  }
  .header img { height: 38px; width: auto; }
  .header h1 { font-size: 20px; font-weight: 700; color: #d7deca; letter-spacing: -0.5px; }

  h2 { font-size: 15px; margin-bottom: 10px; color: #293a34; }
  h3 { font-size: 12px; margin: 12px 0 8px; color: #5a6b62; text-transform: uppercase; letter-spacing: 0.5px; }

  .card {
    background: white;
    border-radius: 6px;
    padding: 14px 16px;
    margin-bottom: 12px;
    border: 1px solid #e2e5dc;
    box-shadow: 0 1px 3px rgba(41,58,52,0.06);
  }

  /* ====== STOCK COMPACT ====== */
  .stock-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 6px;
  }
  .stock-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    background: #f9faf7;
    border-radius: 4px;
    border-left: 3px solid #d7deca;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .stock-row:hover { background: #eef0ea; }
  .stock-row.featured {
    background: #293a34;
    color: #d7deca;
    border-left-color: #8ba888;
    font-weight: 600;
  }
  .stock-row.featured:hover { background: #3a4f47; }
  .stock-row.featured .stock-qte { font-size: 18px; color: #d7deca; }
  .stock-row.alerte {
    background: #fce8e8;
    border-left-color: #c0392b;
  }
  .stock-row.alerte .stock-qte { color: #c0392b; font-weight: 700; }
  .stock-name { flex: 1; margin-right: 10px; line-height: 1.3; }
  .stock-qte {
    font-size: 15px;
    font-weight: 700;
    min-width: 40px;
    text-align: right;
  }
  .stock-sub { font-size: 10px; opacity: 0.6; }

  /* Détails dépliables */
  .stock-details {
    display: none;
    background: white;
    border: 1px solid #d7deca;
    border-radius: 4px;
    padding: 8px 12px;
    margin: 4px 0 8px;
    font-size: 11px;
    grid-column: 1 / -1;
  }
  .stock-details.open { display: block; }
  .stock-details table { font-size: 11px; }
  .stock-details th, .stock-details td { padding: 4px 6px; }
  .stock-details th {
    background: #f4f5f1;
    border-bottom: 1px solid #c8cfc0;
    font-size: 10px;
  }

  /* ====== FORMULAIRES ====== */
  .form-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 8px;
  }
  .form-group { margin-bottom: 6px; }
  .form-group label {
    display: block;
    font-size: 10px;
    color: #5a6b62;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
  }
  input, select, button {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #c8cfc0;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    background: white;
    color: #293a34;
  }
  input:focus, select:focus { outline: none; border-color: #293a34; box-shadow: 0 0 0 2px rgba(41,58,52,0.1); }
  button {
    background: #293a34;
    color: #d7deca;
    border: none;
    cursor: pointer;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-size: 11px;
    padding: 9px 14px;
  }
  button:hover { background: #3a4f47; }
  button:disabled { background: #a8b0a5; cursor: not-allowed; }
  button.danger { background: #a12c2c; color: #f5e5e5; }
  button.success { background: #4a7a4a; color: #e8f0e0; }
  button.small { width: auto; padding: 4px 10px; font-size: 10px; }
  button.add-extra { background: #d7deca; color: #293a34; padding: 5px 10px; font-size: 11px; width: auto; }
  button.remove-extra { background: #a12c2c; color: #f5e5e5; padding: 3px 7px; font-size: 10px; width: auto; }

  /* ====== MODES DE RÉSERVATION ====== */
  .mode-switch {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }
  .mode-btn {
    flex: 1;
    padding: 8px 12px;
    background: #f4f5f1;
    color: #5a6b62;
    border: 2px solid #d7deca;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    font-size: 12px;
    text-align: center;
    transition: all 0.15s;
  }
  .mode-btn.active {
    background: #293a34;
    color: #d7deca;
    border-color: #293a34;
  }
  .mode-btn:hover:not(.active) { background: #e8ebe4; }

  .kit-preview {
    background: #f4f5f1;
    border: 1px solid #d7deca;
    border-radius: 4px;
    padding: 10px;
    margin-top: 8px;
    font-size: 12px;
  }
  .kit-preview table { font-size: 11px; }
  .kit-preview th, .kit-preview td { padding: 4px 6px; }
  .kit-preview th { background: none; border-bottom: 1px solid #c8cfc0; font-size: 10px; }

  .extras-list { margin-bottom: 8px; }
  .extra-item {
    display: grid;
    grid-template-columns: 2fr 1fr auto;
    gap: 6px;
    align-items: center;
    margin-bottom: 5px;
  }
  .extra-item select, .extra-item input { padding: 5px 8px; font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 7px; text-align: left; border-bottom: 1px solid #e8ebe4; }
  th {
    font-weight: 700;
    color: #293a34;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    background: #f4f5f1;
    border-bottom: 2px solid #293a34;
  }
  tr.groupe-ligne { border-left: 4px solid #8ba888; }
  tr.groupe-ligne td:first-child { font-weight: 600; }
  tr.alerte { background: #fce8e8; }
  tr.alerte td { color: #7a1f1f; }
  tr.alerte .badge { background: #c0392b !important; color: white !important; }
  .badge {
    display: inline-block;
    padding: 3px 7px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .badge.reserve { background: #f0e6c8; color: #6b5a1e; }
  .badge.confirme { background: #d7deca; color: #293a34; }
  .badge.termine { background: #c8d9c8; color: #2c4a2c; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .message { padding: 10px; border-radius: 4px; margin-bottom: 12px; font-size: 12px; }
  .message.success { background: #d7deca; color: #293a34; }
  .message.error { background: #f5d7d7; color: #842029; }
  .loading { text-align: center; padding: 15px; color: #5a6b62; font-size: 12px; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid #d7deca;
    border-top-color: #293a34;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 15px; color: #5a6b62; font-size: 12px; }
  .filtre { max-width: 240px; margin-bottom: 10px; font-size: 12px; }
  .legende { font-size: 10px; color: #5a6b62; margin-bottom: 8px; }
  .legende span {
    display: inline-block; width: 10px; height: 10px;
    background: #fce8e8; border-left: 2px solid #c0392b;
    margin-right: 4px; vertical-align: middle;
  }
</style>
</head>
<body>

<div class="header">
  <img src="logo.png" alt="DuoDisplay" onerror="this.style.display='none'">
  <h1>Gestion Panneaux LED</h1>
</div>

<div id="message"></div>

<!-- ====== 1. STOCK ====== -->
<div class="card">
  <h2>📦 Stock
    <span style="font-size:11px;color:#5a6b62;font-weight:400;margin-left:8px;">
      <input type="date" id="dateVerifDebut" style="width:130px;display:inline-block;padding:4px 6px;font-size:11px;">
      →
      <input type="date" id="dateVerifFin" style="width:130px;display:inline-block;padding:4px 6px;font-size:11px;">
      <button class="small" onclick="chargerStock()" style="margin-left:6px;">Vérifier</button>
    </span>
  </h2>
  <div id="stockGrid" class="stock-grid">
    <div class="loading"><span class="spinner"></span>Chargement...</div>
  </div>
</div>

<!-- ====== 2. NOUVELLE RÉSERVATION ====== -->
<div class="card">
  <h2>➕ Nouvelle réservation</h2>

  <div class="mode-switch">
    <div class="mode-btn active" id="mode-btn-kit" onclick="setMode('kit')">🎬 Kit écrans LED</div>
    <div class="mode-btn" id="mode-btn-libre" onclick="setMode('libre')">📦 Articles seuls</div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Client</label>
      <input type="text" id="client" placeholder="Nom du client">
    </div>
    <div class="form-group" id="bloc-nbEcrans">
      <label>Nombre d'écrans LED</label>
      <input type="number" id="nbEcrans" min="0" value="1" oninput="calculerApercu()">
    </div>
    <div class="form-group">
      <label>Date de début</label>
      <input type="date" id="debut">
    </div>
    <div class="form-group">
      <label>Date de fin</label>
      <input type="date" id="fin">
    </div>
  </div>

  <h3>➕ Articles supplémentaires</h3>
  <div class="extras-list" id="extrasList"></div>
  <button class="add-extra" onclick="ajouterExtra()">+ Ajouter un article</button>

  <h3>🔍 Aperçu</h3>
  <div class="kit-preview" id="kitPreview">
    <em>Saisissez un nombre d'écrans ou ajoutez des articles.</em>
  </div>

  <div style="margin-top:12px;">
    <button id="btnResa" onclick="validerReservation()">Réserver</button>
  </div>
</div>

<!-- ====== 3. LISTE DES RÉSERVATIONS ====== -->
<div class="card">
  <h2>📋 Réservations
    <button class="small" onclick="chargerReservations()" style="margin-left:8px;">🔄 Rafraîchir</button>
  </h2>
  <div class="legende"><span></span> Ligne rouge = surréservation détectée</div>
  <input type="text" class="filtre" id="filtreClient" placeholder="Filtrer par client..." oninput="afficherReservations()">
  <div id="tableReservations" class="loading"><span class="spinner"></span>Chargement...</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwV3pXjA5q7GCenjhXRfpdGF1RDTE9bGui-030CrbxWDHnLneMhDkJhR-knrVyWJdaCBg/exec";

const KIT_STANDARD = {
  "MPI-PLD001-1": { parEcran: 1 },
  "MPI-PLD002-1": { parEcran: 3 },
  "MPI-PLA003":   { fixe: 1 },
  "MPI-PLA007":   { fixe: 1 },
  "MPI-PLA005":   { moins1: true },
  "MPI-PLA008":   { moins1: true },
  "MPI-PLT001":   { arrondi: "ceil", parEcran: 0.1 }
};

const NOVASTAR_IDS = ["MPI-NOVASTAR/TB60", "MPI-NOVASTAR/TB8"];
const ID_CHASSIS = "MPI-PLD001-1";
const ID_TUILE = "MPI-PLD002-1";
const KIT_LED_ID = "KIT-LED";
const KIT_LED_COMPOSANTS = { "MPI-PLD001-1": 1, "MPI-PLD002-1": 3 };

let reservationsCache = [];
let inventaireCache = [];
let modeActuel = "kit";

function formatDate(date) {
  return date.getFullYear() + "-" +
         String(date.getMonth() + 1).padStart(2, '0') + "-" +
         String(date.getDate()).padStart(2, '0');
}
function aujourdhui() { return formatDate(new Date()); }

function afficherMessage(texte, type) {
  const el = document.getElementById('message');
  el.innerHTML = '<div class="message ' + type + '">' + texte + '</div>';
  setTimeout(function() { el.innerHTML = ''; }, 5000);
}

function setMode(m) {
  modeActuel = m;
  document.getElementById('mode-btn-kit').classList.toggle('active', m === 'kit');
  document.getElementById('mode-btn-libre').classList.toggle('active', m === 'libre');
  document.getElementById('bloc-nbEcrans').style.display = (m === 'kit') ? 'block' : 'none';
  calculerApercu();
}

function fetchJSON(url, tentatives) {
  tentatives = tentatives || 3;
  return fetch(url, { redirect: 'follow' })
    .then(function(r) { return r.text(); })
    .then(function(text) {
      if (text.trim().startsWith("<")) throw new Error("HTML_RESPONSE");
      try { return JSON.parse(text); } catch (e) { throw new Error("PARSE_ERROR"); }
    })
    .catch(function(err) {
      if (tentatives > 1 && (err.message === "HTML_RESPONSE" || err.message === "PARSE_ERROR")) {
        return new Promise(function(resolve) { setTimeout(resolve, 1000); })
          .then(function() { return fetchJSON(url, tentatives - 1); });
      }
      throw err;
    });
}

function appelAPI(action, methode, data) {
  let url = API_URL;
  let options = { redirect: 'follow' };
  if (methode === 'POST') {
    options.method = 'POST';
    options.headers = { 'Content-Type': 'text/plain;charset=utf-8' };
    options.body = JSON.stringify(data);
    return fetch(url, options)
      .then(function(r) { return r.text(); })
      .then(function(text) {
        if (text.trim().startsWith("<")) throw new Error("HTML_RESPONSE");
        return JSON.parse(text);
      });
  } else {
    url += '?action=' + action;
    return fetchJSON(url);
  }
}

// ====== STOCK ======
function chargerStock() {
  const debut = document.getElementById('dateVerifDebut').value || aujourdhui();
  const fin = document.getElementById('dateVerifFin').value || aujourdhui();
  const el = document.getElementById('stockGrid');
  el.innerHTML = '<div class="loading"><span class="spinner"></span>Chargement...</div>';

  const url = API_URL + '?action=disponibilite&debut=' + debut + '&fin=' + fin + '&t=' + Date.now();
  fetchJSON(url)
    .then(function(data) {
      const dispoParId = {};
      data.forEach(function(item) { dispoParId[item.id] = item; });

      let html = '';

      // === CARTE PRINCIPALE : PANNEAUX LED COMPLETS ===
      const chassis = dispoParId[ID_CHASSIS] ? dispoParId[ID_CHASSIS].disponible : 0;
      const tuiles = dispoParId[ID_TUILE] ? dispoParId[ID_TUILE].disponible : 0;
      const panneauxComplets = Math.min(chassis, Math.floor(tuiles / 3));

      html += '<div class="stock-row featured" onclick="toggleDetails(\'d-led\')">';
      html += '<div class="stock-name">Panneaux LED complets<div class="stock-sub">châssis + 3 tuiles • cliquer pour détails</div></div>';
      html += '<div class="stock-qte">' + panneauxComplets + '</div>';
      html += '</div>';
      html += '<div class="stock-details" id="d-led">';
      html += '<table><tr><th>Composant</th><th>Dispo</th></tr>';
      html += '<tr><td>Châssis (MPI-PLD001-1)</td><td>' + chassis + '</td></tr>';
      html += '<tr><td>Tuiles (MPI-PLD002-1)</td><td>' + tuiles + '</td></tr>';
      html += '</table></div>';

      // === NovaStar fusionné ===
      let novaDispo = 0, novaTotal = 0;
      let novaDetails = '';
      NOVASTAR_IDS.forEach(function(id) {
        if (dispoParId[id]) {
          novaDispo += dispoParId[id].disponible;
          novaTotal += dispoParId[id].total;
          novaDetails += '<tr><td>' + dispoParId[id].type + '</td><td>' + dispoParId[id].disponible + '</td></tr>';
        }
      });
      if (novaTotal > 0) {
        const cls = novaDispo < 3 ? 'stock-row alerte' : 'stock-row';
        html += '<div class="' + cls + '" onclick="toggleDetails(\'d-nova\')">';
        html += '<div class="stock-name">NovaStar TB6 / TB8<div class="stock-sub">cliquer pour détails</div></div>';
        html += '<div class="stock-qte">' + novaDispo + '</div>';
        html += '</div>';
        html += '<div class="stock-details" id="d-nova">';
        html += '<table><tr><th>Modèle</th><th>Dispo</th></tr>' + novaDetails + '</table></div>';
      }

      // === Autres articles ===
      data.forEach(function(item) {
        if (NOVASTAR_IDS.indexOf(item.id) >= 0) return;
        const cls = item.disponible < 5 ? 'stock-row alerte' : 'stock-row';
        html += '<div class="' + cls + '">';
        html += '<div class="stock-name">' + item.type + '<div class="stock-sub">sur ' + item.total + ' en stock</div></div>';
        html += '<div class="stock-qte">' + item.disponible + '</div>';
        html += '</div>';
      });

      el.innerHTML = html;
    })
    .catch(function(err) {
      el.innerHTML = '<div class="message error">Erreur : ' + err.message + '</div>';
    });
}

function toggleDetails(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

// ====== INVENTAIRE POUR EXTRAS ======
function chargerInventairePourExtras() {
  if (inventaireCache.length > 0) return;
  appelAPI('inventaire', 'GET').then(function(data) {
    inventaireCache = data;
    // Ajouter le pseudo-article "Panneaux LED complets" en tête
    inventaireCache.unshift({
      id: KIT_LED_ID,
      type: "🎬 Panneaux LED complets (châssis + 3 tuiles)",
      total: 0
    });
  }).catch(function() {});
}

function ajouterExtra() {
  const list = document.getElementById('extrasList');
  const div = document.createElement('div');
  div.className = 'extra-item';

  let options = '<option value="">-- Choisir un article --</option>';
  inventaireCache.forEach(function(item) {
    options += '<option value="' + item.id + '">' + item.type + '</option>';
  });

  div.innerHTML =
    '<select class="extra-select">' + options + '</select>' +
    '<input type="number" class="extra-qte" min="1" value="1" placeholder="Qté">' +
    '<button class="remove-extra" onclick="this.parentElement.remove();calculerApercu();">✕</button>';

  div.querySelector('.extra-select').addEventListener('change', calculerApercu);
  div.querySelector('.extra-qte').addEventListener('input', calculerApercu);

  list.appendChild(div);
  calculerApercu();
}

function getExtras() {
  const extras = [];
  document.querySelectorAll('.extra-item').forEach(function(div) {
    const id = div.querySelector('.extra-select').value;
    const qte = parseInt(div.querySelector('.extra-qte').value) || 0;
    if (id && qte > 0) extras.push({ id: id, quantite: qte });
  });
  return extras;
}

// ====== APERÇU DU KIT ======
function calculerKitLocal(nbEcrans) {
  const kit = {};
  for (const id in KIT_STANDARD) {
    const regle = KIT_STANDARD[id];
    let qte = 0;
    if (regle.fixe !== undefined) qte = regle.fixe;
    else if (regle.moins1) qte = Math.max(0, nbEcrans - 1);
    else if (regle.arrondi === "ceil") qte = Math.ceil(nbEcrans * regle.parEcran);
    else qte = nbEcrans * regle.parEcran;
    if (qte > 0) kit[id] = qte;
  }
  return kit;
}

function fusionnerExtrasLocal(kit, extras) {
  extras.forEach(function(extra) {
    if (extra.id === KIT_LED_ID) {
      for (const compId in KIT_LED_COMPOSANTS) {
        const qte = KIT_LED_COMPOSANTS[compId] * extra.quantite;
        kit[compId] = (kit[compId] || 0) + qte;
      }
      return;
    }
    if (kit[extra.id]) kit[extra.id] += extra.quantite;
    else kit[extra.id] = extra.quantite;
  });
  return kit;
}

function calculerApercu() {
  const el = document.getElementById('kitPreview');
  const nbEcrans = (modeActuel === 'kit') ? (parseInt(document.getElementById('nbEcrans').value) || 0) : 0;
  const extras = getExtras();

  let kit = {};
  if (modeActuel === 'kit' && nbEcrans >= 1) {
    kit = calculerKitLocal(nbEcrans);
    // NovaStar automatique (affiché génériquement)
    kit["MPI-NOVASTAR/TB60"] = 1;
  }
  kit = fusionnerExtrasLocal(kit, extras);

  if (Object.keys(kit).length === 0) {
    el.innerHTML = '<em>Saisissez un nombre d\'écrans ou ajoutez des articles.</em>';
    return;
  }

  let html = '<table><thead><tr><th>Article</th><th>Quantité</th></tr></thead><tbody>';
  for (const id in kit) {
    let label = id;
    if (id === "MPI-NOVASTAR/TB60") label = "NovaStar TB6 / TB8 (auto)";
    else {
      const item = inventaireCache.find(function(i) { return i.id === id; });
      label = item ? item.type : id;
    }
    html += '<tr><td>' + label + '</td><td>' + kit[id] + '</td></tr>';
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

// ====== VALIDER LA RÉSERVATION ======
function validerReservation() {
  const client = document.getElementById('client').value;
  const debut = document.getElementById('debut').value;
  const fin = document.getElementById('fin').value;

  if (!client || !debut || !fin) {
    afficherMessage('Veuillez remplir le client et les dates', 'error');
    return;
  }

  const extras = getExtras();
  const btn = document.getElementById('btnResa');
  btn.disabled = true;
  btn.textContent = 'Envoi...';

  if (modeActuel === 'kit') {
    const nbEcrans = parseInt(document.getElementById('nbEcrans').value) || 0;
    if (nbEcrans < 1 && extras.length === 0) {
      afficherMessage('Saisissez au moins 1 écran ou un article', 'error');
      btn.disabled = false;
      btn.textContent = 'Réserver';
      return;
    }
    appelAPI('creerReservationKit', 'POST', {
      client: client, nbEcrans: nbEcrans, debut: debut, fin: fin, extras: extras
    }).then(traiterReponseResa).catch(traiterErreurResa).finally(resetBtn);
  } else {
    if (extras.length === 0) {
      afficherMessage('Ajoutez au moins un article', 'error');
      btn.disabled = false;
      btn.textContent = 'Réserver';
      return;
    }
    appelAPI('creerReservationLibre', 'POST', {
      client: client, articles: extras, debut: debut, fin: fin
    }).then(traiterReponseResa).catch(traiterErreurResa).finally(resetBtn);
  }
}

function traiterReponseResa(res) {
  if (res.succes) {
    afficherMessage('✅ ' + res.message, 'success');
    document.getElementById('client').value = '';
    document.getElementById('nbEcrans').value = 1;
    document.getElementById('debut').value = '';
    document.getElementById('fin').value = '';
    document.getElementById('extrasList').innerHTML = '';
    document.getElementById('kitPreview').innerHTML = '<em>Aperçu vide.</em>';
    chargerStock();
    chargerReservations();
  } else {
    afficherMessage('❌ ' + res.message, 'error');
  }
}

function traiterErreurResa(err) {
  afficherMessage('Erreur : ' + err.message, 'error');
}

function resetBtn() {
  const btn = document.getElementById('btnResa');
  btn.disabled = false;
  btn.textContent = 'Réserver';
}

// ====== LISTE DES RÉSERVATIONS ======
function chargerReservations() {
  const el = document.getElementById('tableReservations');
  el.innerHTML = '<div class="loading"><span class="spinner"></span>Chargement...</div>';
  appelAPI('reservations', 'GET')
    .then(function(data) {
      reservationsCache = data;
      afficherReservations();
    })
    .catch(function(err) {
      el.innerHTML = '<div class="message error">Erreur : ' + err.message + '</div>';
    });
}

function afficherReservations() {
  const el = document.getElementById('tableReservations');
  const filtre = document.getElementById('filtreClient').value.toLowerCase();

  const groupes = {};
  reservationsCache.forEach(function(r) {
    if (r.statut === 'Annulé') return;
    if (filtre && r.client.toLowerCase().indexOf(filtre) === -1) return;
    const g = r.groupe || 'sans-groupe-' + r.id;
    if (!groupes[g]) groupes[g] = [];
    groupes[g].push(r);
  });

  const groupesTries = Object.keys(groupes).sort(function(a, b) {
    return groupes[a][0].debut.localeCompare(groupes[b][0].debut);
  });

  let html = '<table><thead><tr>';
  html += '<th>Client</th><th>Article</th><th>Qté</th><th>Début</th><th>Fin</th><th>Statut</th><th>Actions</th>';
  html += '</tr></thead><tbody>';

  let count = 0;
  groupesTries.forEach(function(g) {
    const lignes = groupes[g];
    lignes.forEach(function(r, idx) {
      count++;
      let badgeClass = 'reserve';
      if (r.statut === 'Confirmé') badgeClass = 'confirme';
      else if (r.statut === 'Terminé') badgeClass = 'termine';

      let actions = '';
      if (idx === 0) {
        if (r.statut === 'Réservé') {
          actions = '<button class="small success" onclick="changerStatutGroupe(\'' + g + '\', \'Confirmé\')">Confirmer</button>';
          actions += '<button class="small danger" onclick="changerStatutGroupe(\'' + g + '\', \'Annulé\')">Annuler</button>';
        } else if (r.statut === 'Confirmé') {
          actions += '<button class="small danger" onclick="changerStatutGroupe(\'' + g + '\', \'Annulé\')">Annuler</button>';
        }
      }

      html += '<tr class="groupe-ligne">';
      html += '<td>' + (idx === 0 ? r.client : '') + '</td>';
      html += '<td>' + r.materiel + '</td>';
      html += '<td>' + r.quantite + '</td>';
      html += '<td>' + (idx === 0 ? r.debut : '') + '</td>';
      html += '<td>' + (idx === 0 ? r.fin : '') + '</td>';
      html += '<td><span class="badge ' + badgeClass + '">' + r.statut + '</span></td>';
      html += '<td class="actions">' + actions + '</td>';
      html += '</tr>';
    });
  });

  if (count === 0) {
    html += '<tr><td colspan="7" class="empty">Aucune réservation</td></tr>';
  }

  html += '</tbody></table>';
  el.innerHTML = html;
}

function changerStatutGroupe(groupe, statut) {
  if (!confirm('Passer TOUTES les lignes de ce groupe au statut "' + statut + '" ?')) return;
  appelAPI('changerStatutGroupe', 'POST', {action: 'changerStatutGroupe', groupe: groupe, statut: statut})
    .then(function(res) {
      if (res.succes) {
        afficherMessage('✅ ' + res.message, 'success');
        chargerReservations();
        chargerStock();
      } else {
        afficherMessage('❌ ' + res.message, 'error');
      }
    });
}

// ====== INIT ======
document.addEventListener('DOMContentLoaded', function() {
  const auj = aujourdhui();
  document.getElementById('dateVerifDebut').value = auj;
  document.getElementById('dateVerifFin').value = auj;
  chargerStock();
  chargerReservations();
  chargerInventairePourExtras();
});
</script>
